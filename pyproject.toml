[project]
name = "spt-weapon-optimizer"
version = "0.1.0"
description = "Read-only SPT attachment-tree optimizer for agents"
requires-python = ">=3.12"
dependencies = [
    "ortools>=9.15.6755",
    "simplejson>=4.2.0",
]

[project.scripts]
spt-build = "weapon_optimizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weapon_optimizer"]
